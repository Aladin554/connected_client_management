name: Deploy Ops

# Deploys to ops.connectededucation.com on the DigitalOcean droplet.
# The SSH key can only run /usr/local/bin/deploy-site on the server, which
# backs up, checks out this commit, builds, migrates and health-checks the site.
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      commit:
        description: "Commit SHA to deploy, e.g. for a rollback (empty = latest main)"
        required: false
        default: ""

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Deploy on droplet
        env:
          DROPLET_HOST: ${{ secrets.DROPLET_HOST }}
          DROPLET_SSH_KEY: ${{ secrets.DROPLET_SSH_KEY }}
          DROPLET_KNOWN_HOSTS: ${{ secrets.DROPLET_KNOWN_HOSTS }}
          COMMIT: ${{ inputs.commit || github.sha }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DROPLET_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DROPLET_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 -o ServerAliveInterval=30 \
            "root@$DROPLET_HOST" "ops $COMMIT"
